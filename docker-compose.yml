services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siliconsoup
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: siliconsoup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siliconsoup -d siliconsoup"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://siliconsoup:localdev@db:5432/siliconsoup?sslmode=disable
      PORT: "8080"
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
