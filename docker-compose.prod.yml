services:
  db:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: siliconsoup
    ports: []
    restart: always

  api:
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/siliconsoup?sslmode=disable
      PORT: "8080"
      ENVIRONMENT: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL}
    ports:
      - "8080:8080"
    restart: always
