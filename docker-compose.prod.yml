services:
  db:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: siliconsoup
    ports: []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/siliconsoup?sslmode=disable
      PORT: "8080"
      ENVIRONMENT: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL}
    ports:
      - "8080:8080"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
